name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  JULIA_NUM_THREADS: 4
  OPENBLAS_NUM_THREADS: 1

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # The ecosystem requires Julia >= 1.12.
          - '1.12'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        arch:
          - x64
        exclude:
          - version: 'nightly'
            os: macos-latest
          - version: 'nightly'
            os: windows-latest
    steps:
      # The fifteen packages are independent repositories that find each other
      # through [sources] path dependencies (`Networks = {path = "../Networks.jl"}`).
      # A lone checkout has no siblings, so those paths dangle and Pkg fails to
      # resolve before a single test runs. Rebuild the layout every developer has
      # locally: this package in a directory named after it, siblings beside it.
      - uses: actions/checkout@v4
        with:
          path: Relevent.jl

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - name: Reconstruct source closure from Project.toml files
        shell: bash
        working-directory: Relevent.jl
        run: julia .github/scripts/checkout_sources.jl > sibling-revisions.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sibling-revisions-${{ matrix.version }}-${{ matrix.os }}
          path: Relevent.jl/sibling-revisions.txt

      - uses: julia-actions/cache@v2

      - name: Run tests
        shell: bash
        working-directory: Relevent.jl
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          directories: Relevent.jl/src

      - uses: codecov/codecov-action@v4
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Allocation regression gates
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: Relevent.jl
        run: |
          julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
          julia --project=benchmark benchmark/regression_tests.jl
