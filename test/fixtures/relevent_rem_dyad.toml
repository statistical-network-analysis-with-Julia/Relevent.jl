[tolerance]
# Both likelihoods are EXACT — no Monte Carlo, no sampling of the risk
# set — so the two implementations maximize the same function and must
# reach the same optimum. The only admissible discrepancy is optimizer
# termination slack: R uses optim/BFGS (reltol = 1e-15 above), Julia uses
# Newton-Raphson. Observed disagreement at the frozen values is <= 2e-7,
# and the two log-likelihoods agree to < 1e-9 -- i.e. both are sitting on
# the same maximum. 1e-6 is that, with an order of magnitude of margin.
# It is NOT a Monte-Carlo allowance: a failure here means the LIKELIHOOD
# differs, not that a random seed moved.
default = 1e-6
# The inputs are echoed exactly; they are read, not compared.
input_time = 1e-12

